name: UTMB Daily Sync

on:
  schedule:
    # 22:45 UTC = 07:45 KST next day
    - cron: "45 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jackson-utmb-sync
  cancel-in-progress: false

jobs:
  sync-utmb:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UTMB_PROFILE_URL: https://utmb.world/en/runner/5913759.jesun.ryu
      UTMB_NATIONALITY: South Korea
      UTMB_GENDER: Men
      UTMB_AGE_GROUP: 35-39

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install -r requirements.txt

      - name: Install browser fallback for UTMB
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sync UTMB index and Korea rank estimate
        run: python sync_utmb.py
