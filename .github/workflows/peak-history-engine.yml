name: Peak History Engine

on:
  schedule:
    # 22:35 UTC = 07:35 KST next day. Daily Running Engine runs at 07:15 KST.
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Rebuild all historical Peak snapshots"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: jackson-running-engine
  cancel-in-progress: false

jobs:
  build-peak-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Peak history
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_history }}" = "true" ]; then
            python build_peak_history.py --full
          else
            python build_peak_history.py --write-days 30
          fi
