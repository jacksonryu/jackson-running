name: Daily Running Engine

on:
  schedule:
    # GitHub cron은 UTC 기준. 22:15 UTC = 다음날 07:15 KST.
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jackson-running-engine
  cancel-in-progress: false

jobs:
  update-running-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Force incremental sync on stateless runner
        shell: bash
        run: |
          mkdir -p data
          printf '{"last_synced_at":"github-actions"}\n' > data/.sync_state.json

      - name: Sync Intervals.icu to Supabase
        run: python sync_to_supabase.py

      - name: Build daily analytics context
        run: python build_daily_context.py

      - name: Generate Claude coach report
        run: python claude_coach.py
